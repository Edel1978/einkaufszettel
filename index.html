<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="color-scheme" content="light dark">
  <title>Einkaufszettel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="kopf">
    <button id="zurueck" class="icon-btn" type="button" aria-label="Zurück zur Übersicht" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="titel">Einkaufszettel</h1>
    <button id="kopf-menue" class="icon-btn" type="button" aria-label="Listen-Menü" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
    <a id="kopf-einstellungen" class="icon-btn" href="#/einstellungen" aria-label="Einstellungen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>
    </a>
  </header>
  <div id="offline" class="offline-leiste" role="status" hidden>Offline – deine Listen funktionieren, Fotos einlesen erst wieder mit Internet.</div>

  <!-- Unsichtbare Dateiauswahl für Fotos: einmal direkt die Kamera, einmal die Galerie -->
  <input id="foto-kamera" type="file" accept="image/*" capture="environment" hidden>
  <input id="foto-galerie" type="file" accept="image/*" hidden>

  <main id="inhalt"></main>

  <dialog id="dialog"></dialog>
  <div id="meldung" class="meldung" role="status" aria-live="polite" hidden></div>
</body>
</html>
