# Excel-Empfänger der Einkaufszettel-App auf dem NAS: Programm + Tailscale (HTTPS im eigenen Tailnet)
# Ordner auf dem NAS: /volume1/docker/einkauf (Pfade absolut, wie es die UGOS-Docker-App erwartet)
# Vorher: Ordner listen und tailscale/state anlegen, dem Benutzer Docker Schreibrecht auf listen geben,
# einkauf.env mit TS_AUTHKEY anlegen (Vorlage: einkauf.env.beispiel). Schritte: ANLEITUNG_NAS.md
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: einkauf-tailscale
    hostname: einkauf              # → https://einkauf.<tailnet>.ts.net
    env_file:
      - /volume1/docker/einkauf/einkauf.env   # liefert TS_AUTHKEY
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - /volume1/docker/einkauf/tailscale/state:/var/lib/tailscale
      - /volume1/docker/einkauf/tailscale/serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    restart: unless-stopped

  app:
    build: /volume1/docker/einkauf
    image: einkauf-empfaenger:latest
    container_name: einkauf-app
    network_mode: service:tailscale
    depends_on:
      - tailscale
    user: "1006:100"               # UGOS-Benutzer "Docker", nie root
    volumes:
      - /volume1/docker/einkauf/listen:/listen
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m
    cpus: 0.5
    restart: unless-stopped
